services:
  - type: web
    name: barangay-minante-1
    runtime: python
    region: singapore
    # SQLite is the configured runtime database. Render Free is suitable only
    # for evaluation because its filesystem is ephemeral.
    plan: free
    numInstances: 1
    rootDir: barangay_system
    buildCommand: pip install -r requirements.txt
    startCommand: python seed.py && gunicorn --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.15
      - key: DATA_DIR
        value: /tmp/minante-data
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: FLASK_DEBUG
        value: "0"
      - key: INITIAL_ADMIN_USERNAME
        sync: false
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_NAME
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
