{% extends 'base.html' %}{% block page_title %}Manage Profile{% endblock %}{% block content %}<div class="page-head"><div><h1>Manage Profile</h1><p class="muted">Update your legitimate contact information or change your password.</p></div></div><div class="grid-2"><section class="card"><h2>Profile information</h2><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="action" value="profile"><div class="field"><label>Full name</label><input name="full_name" value="{{ current_user.full_name }}" required></div><div class="field"><label>Email</label><input type="email" name="email" value="{{ current_user.email or '' }}" required></div><div class="field"><label>Contact number</label><input name="contact_number" value="{{ current_user.contact_number or '' }}"></div><div class="field"><label>Address</label><textarea name="address">{{ current_user.address or '' }}</textarea></div><button class="btn btn-primary">Save profile</button></form></section><section class="card"><h2>Change password</h2><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="action" value="password"><div class="field"><label>Current password</label><input type="password" name="current_password" required></div><div class="field"><label>New password</label><input type="password" name="password" minlength="10" required></div><div class="field"><label>Confirm new password</label><input type="password" name="confirm_password" minlength="10" required></div><button class="btn btn-primary">Change password</button></form></section></div>{% endblock %}
