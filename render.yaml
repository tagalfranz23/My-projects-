services:
  - type: web
    name: barangay-minante-1
    runtime: python
    region: singapore
    plan: 0.5c-512mb
    numInstances: 1
    rootDir: barangay_system
    buildCommand: pip install -r requirements.txt
    startCommand: python seed.py && gunicorn --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    disk:
      name: minante-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.15
      - key: DATA_DIR
        value: /var/data
      - key: SQLITE_DB_PATH
        value: /var/data/minante.db
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: FLASK_DEBUG
        value: "0"
      - key: INITIAL_ADMIN_USERNAME
        sync: false
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_NAME
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
